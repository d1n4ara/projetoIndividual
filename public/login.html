<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="./assets/image/logo.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entre Linhas | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <!-- Feedback visual enquanto aguarda -->
    <div id="loading" style="display: none; justify-content: center; align-items: center; position: fixed; top: 0; left: 0; 
    width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.8); z-index: 9999;">
        <img src="./assets/aguarde-pink2.gif" alt="Carregando...">
    </div>

    <!-- Mensagem de erro -->
    <div id="cardErro"
        style="display: none; position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);
    background-color: #ffccd5; color: #c0392b; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.1); z-index: 10000;">
        <span id="mensagem_erro"></span>
    </div>

    <div class="login">
        <!-- Mensagem de erro -->
        <div id="cardErro"
            style="display: none; position: absolute; top: 1rem; left: 50%; transform: translateX(-50%);background-color: #ffccd5; color: #c0392b; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.1); z-index: 10000;">
            <span id="mensagem_erro"></span>
        </div>

        <div id="container">
            <div id="imagem_login">
                <img src="./assets/image/login.png" alt="Ilustração Entre Linhas">
            </div>

            <div id="formulario_login">
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <div id="div_login">
                    <div id="div_titulo">Login</div>
                    <div id="corpo_login">
                        <div id="div_email">
                            <label>E-mail:</label>
                            <input type="text" id="email_input" placeholder="dandara@gmail.com">
                        </div>
                        <div id="div_senha">
                            <label>Senha:</label>
                            <input type="password" id="senha_input" placeholder="********">
                        </div>
                        <div id="div_button">
                            <button id="btnEntrar" onclick="entrar()">Entrar</button>
                        </div>

                        <div id="div_cadastro">
                            <span>Não tem conta?</span>
                            <a href="#" onclick="irParaCadastro()">Cadastre-se</a>
                        </div>
                    </div>
                </div>
            </div>

            <div id="div_aguardar" class="loading-div">
                <img src="./assets/circle-loading.gif" id="loading-gif">
            </div>

        </div>
</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.idUsuario;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function aguardar() {
        const loadingElement = document.getElementById("loading");
        const btnEntrar = document.getElementById("btnEntrar");

        if (loadingElement) loadingElement.style.display = "flex";
        if (btnEntrar) btnEntrar.disabled = true;
    }

    function finalizarAguardar() {
        const loadingElement = document.getElementById("loading");
        const btnEntrar = document.getElementById("btnEntrar");

        if (loadingElement) loadingElement.style.display = "none";
        if (btnEntrar) btnEntrar.disabled = false;
    }

    function mostrarErro(mensagem) {
        const cardErro = document.getElementById('cardErro');
        const mensagem_erro = document.getElementById('mensagem_erro');

        cardErro.style.display = "block";
        mensagem_erro.textContent = mensagem;

        setTimeout(sumirMensagem, 5000);
    }

    function sumirMensagem() {
        document.getElementById('cardErro').style.display = "none";
    }
    function irParaCadastro() {
        setTimeout(() => {
            window.location.href = 'cadastro.html';
        }, 500);
    }


</script>
