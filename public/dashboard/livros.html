<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="./assets/image/logo.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/dashboards.css">
  <title>Cadastro de Livros</title>
</head>

<body>

  <nav class="menu-lateral" id="menuLateral">
    <h2>Entre Linhas</h2>
    <ul>
      <li><a href="./cards.html">Dashboard</a></li>
      <li><a href="./livros.html">Minha Estante</a></li>
      <li><a href="./quiz.html">Quiz</a></li>
      <li><a href="./desafio.html">Missões e Desafios</a></li>
      <li><a href="./perfil.html">Perfil</a></li>
      <li><a href="../index.html">Sair</a></li>
    </ul>
  </nav>

  <div class="conteudo-principal">
    
    <form id="formLivro">
      <input type="text" id="titulo" placeholder="Título" required />
      <input type="text" id="autor" placeholder="Autor" required />
      <select id="fkGenero" required>
        <option value="" disabled selected>Selecione um gênero</option>
      </select>
      <textarea id="descricao" placeholder="Descrição" required></textarea>
      <button type="submit">Cadastrar Livro</button>
    </form>

    <h2>Livros Cadastrados</h2>
    
    <!-- Filtros -->
    <div class="filtros-container">
      <select id="filtroGenero">
        <option value="">Todos os gêneros</option>
      </select>
    </div>

    <div class="carrossel-container">
      <div class="carrossel-track" id="livrosContainer">
        <!-- Os livros serão inseridos nesse espaço pelo JavaScript -->
      </div>
    </div>

    <!--Botães do carrossel-->
    <div class="carrossel-nav">
      <button id="prevBtn" disabled>Anterior</button>
      <button id="nextBtn">Próximo</button>
    </div>
  </div>

  <script>
    // Variáveis globais
    let slideAtual = 0;
    let slidePag = 4;
    let livrosData = [];
    let generosData = [];
    let filtroAtual = 'todos';
    let generoSelecionado = '';

    // Carrega os gêneros do backend
    function carregarGeneros() {
      fetch("/generos/listar")
        .then(res => {
          if (!res.ok) throw new Error("Erro ao carregar gêneros");
          return res.json();
        })
        .then(generos => {
          generosData = generos;
          
          // Preenche o select do formulário
          const selectForm = document.getElementById("fkGenero");
          generos.forEach(gen => {
            const opt = document.createElement("option");
            opt.value = gen.id;
            opt.textContent = gen.nome;
            selectForm.appendChild(opt);
          });
          
          // Preenche o select de filtro
          const selectFiltro = document.getElementById("filtroGenero");
          generos.forEach(gen => {
            const opt = document.createElement("option");
            opt.value = gen.id;
            opt.textContent = gen.nome;
            selectFiltro.appendChild(opt);
          });
        })
        .catch(err => {
          alert("Falha ao carregar gêneros: " + err.message);
        });
    }

    // Atualiza a posição do carrossel
    function updateCarrossel() {
      const carrosselTrack = document.getElementById('livrosContainer');
      const slideWidth = 100 / Math.ceil(livrosData.length / slidePag);
      carrosselTrack.style.transform = `translateX(-${slideAtual * 100}%)`;
      
      document.getElementById('prevBtn').disabled = slideAtual === 0;
      document.getElementById('nextBtn').disabled = slideAtual >= Math.ceil(livrosData.length / slidePag) - 1;
    }

    // Filtra os livros com base nas seleções
    function filtrarLivros() {
      let livrosFiltrados = [...livrosData];
      
      // Aplica filtro por gênero
      if (generoSelecionado) {
        livrosFiltrados = livrosFiltrados.filter(livro => livro.fkGenero == generoSelecionado);
      }
      
      return livrosFiltrados;
    }

    // Lista os livros cadastrados (com filtros aplicados)
    function listarLivros() {
      const livrosFiltrados = filtrarLivros();
      const container = document.getElementById("livrosContainer");
      container.innerHTML = '';
      
      // Se não houver livros com os filtros atuais
      if (livrosFiltrados.length === 0) {
        container.innerHTML = '<div class="carrossel-slide"><p style="grid-column: 1/-1; text-align: center;">Nenhum livro encontrado com os filtros atuais.</p></div>';
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
        return;
      }
      
      // Cria os slides do carrossel
      const totalSlides = Math.ceil(livrosFiltrados.length / slidePag);
      
      for (let i = 0; i < totalSlides; i++) {
        const slide = document.createElement('div');
        slide.className = 'carrossel-slide';
        
        const startIdx = i * slidePag;
        const endIdx = startIdx + slidePag;
        const livrosSlide = livrosFiltrados.slice(startIdx, endIdx);
        
        livrosSlide.forEach(livro => {
          const livroCard = document.createElement('div');
          livroCard.className = 'livro-card';
          livroCard.innerHTML = `
            <button class="favorito-btn ${livro.favorito ? 'favoritado' : ''}" 
                    data-livro-id="${livro.id}" 
                    onclick="toggleFavorito(${livro.id}, ${!livro.favorito})">
            </button>
            <strong>${livro.titulo}</strong>
            <em>por ${livro.autor}</em>
            <p>${livro.descricao}</p>
            <div class="genero">${livro.genero}</div>
          `;
          slide.appendChild(livroCard);
        });
        
        container.appendChild(slide);
      }
      
      // Reseta para o primeiro slide
      slideAtual = 0;
      updateCarrossel();
    }

    // Carrega todos os livros do servidor
    function carregarLivros() {
      fetch("/livros/listar")
        .then(res => {
          if (!res.ok) throw new Error("Erro ao listar livros");
          return res.json();
        })
        .then(livros => {
          livrosData = livros;
          listarLivros();
        })
        .catch(err => {
          alert("Erro ao buscar livros: " + err.message);
        });
    }

    // Cadastra um novo livro
    document.getElementById("formLivro").addEventListener("submit", function (e) {
      e.preventDefault();

      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;

      const titulo = document.getElementById("titulo").value;
      const autor = document.getElementById("autor").value;
      const descricao = document.getElementById("descricao").value;
      const fkGenero = document.getElementById("fkGenero").value;
      const generoNovo = document.getElementById("generoNovo").value;

      // Se um novo gênero foi digitado, usamos ele
      const generoPayload = generoNovo ? 
        { novoGenero: generoNovo } : 
        { fkGenero: fkGenero };

      fetch("/livros/cadastrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          titulo, 
          autor, 
          descricao,
          ...generoPayload
        })
      })
        .then(res => {
          btn.disabled = false;
          if (!res.ok) throw new Error("Erro ao cadastrar livro");
          return res.json();
        })
        .then(data => {
          alert(data.mensagem || data.erro);
          if (!data.erro) {
            document.getElementById("formLivro").reset();
            carregarLivros();
            
            // Se foi adicionado um novo gênero, recarrega a lista de gêneros
            if (generoNovo) {
              carregarGeneros();
            }
          }
        })
        .catch(err => {
          alert("Erro na comunicação com o servidor: " + err.message);
          btn.disabled = false;
        });
    });

    // Navegação do carrossel
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (slideAtual > 0) {
        slideAtual--;
        updateCarrossel();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      const livrosFiltrados = filtrarLivros();
      if (slideAtual < Math.ceil(livrosFiltrados.length / slidePag) - 1) {
        slideAtual++;
        updateCarrossel();
      }
    });

    // Filtro por gênero
    document.getElementById('filtroGenero').addEventListener('change', function() {
      generoSelecionado = this.value;
      listarLivros();
    });

    // Ajusta o número de livros por slide conforme o tamanho da tela
    function adjustslidePag() {
      const width = window.innerWidth;
      
      if (width < 600) {
        slidePag = 1;
      } else if (width < 900) {
        slidePag = 2;
      } else if (width < 1200) {
        slidePag = 3;
      } else {
        slidePag = 4;
      }
      
      if (livrosData.length > 0) {
        listarLivros();
      }
    }

    // Inicialização
    window.onload = function () {
      carregarGeneros();
      carregarLivros();
      window.addEventListener('resize', adjustSlidesPerPage);
    };

  </script>
</body>

</html>
