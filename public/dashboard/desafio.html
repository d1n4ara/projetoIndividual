<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórum de Discussão</title>
  <link rel="stylesheet" href="../css/dashboards.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <header>
    <h1>Fórum de Discussão</h1>
    <div class="user-actions">
      <button id="loginBtn">Login</button>
      <button id="registerBtn">Registrar</button>
      <span id="userName" class="hidden"></span>
      <button id="logoutBtn" class="hidden">Sair</button>
    </div>
  </header>

  <main>
    <section class="post-form hidden">
      <h2>Criar Nova Postagem</h2>
      <form id="postForm">
        <div class="form-group">
          <label for="postTitle">Título:</label>
          <input type="text" id="postTitle" required>
        </div>
        <div class="form-group">
          <label for="postContent">Conteúdo:</label>
          <textarea id="postContent" rows="5" required></textarea>
        </div>
        <button type="submit">Publicar</button>
      </form>
    </section>

    <section class="posts-container">
      <h2>Últimas Postagens</h2>
      <div class="filter-controls">
        <input type="text" id="searchInput" placeholder="Buscar postagens...">
        <button id="newPostBtn">Nova Postagem</button>
      </div>
      <div id="postsList" class="posts-list">
        <!-- Postagens serão carregadas aqui via JavaScript -->
      </div>
    </section>
  </main>

  <!-- Modal de Login/Registro -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="register">Registrar</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">Email:</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Senha:</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit">Entrar</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <label for="registerName">Nome:</label>
          <input type="text" id="registerName" required>
        </div>
        <div class="form-group">
          <label for="registerEmail">Email:</label>
          <input type="email" id="registerEmail" required>
        </div>
        <div class="form-group">
          <label for="registerPassword">Senha:</label>
          <input type="password" id="registerPassword" required>
        </div>
        <button type="submit">Registrar</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const postForm = document.getElementById("postForm");
      const postsList = document.getElementById("postsList");
      const newPostBtn = document.getElementById("newPostBtn");
      const postSection = document.querySelector(".post-form");

      // Pega o ID do usuário da sessionStorage
      const idUsuario = sessionStorage.ID_USUARIO;

      if (!idUsuario) {
        alert("Você precisa estar logado para visualizar ou criar postagens.");
        return;
      }

      function carregarPostagens() {
        fetch("/postagens/listar")
          .then(res => res.json())
          .then(data => {
            postsList.innerHTML = "";
            data.forEach(post => {
              const postEl = document.createElement("div");
              postEl.classList.add("post");
              postEl.innerHTML = `
            <h3>${post.titulo}</h3>
            <p>${post.descricao}</p>
            <span>Postado por <strong>${post.nome}</strong> em ${new Date(post.dataPostagem).toLocaleString()}</span>
          `;
              postsList.appendChild(postEl);
            });
          })
          .catch(err => {
            console.error("Erro ao carregar postagens:", err);
          });
      }

      postForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const titulo = document.getElementById("postTitle").value;
        const descricao = document.getElementById("postContent").value;

        fetch("/postagens/criar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ titulo, descricao, fkUsuario: idUsuario })
        })
          .then(res => {
            if (res.ok) {
              postForm.reset();
              carregarPostagens();
              postSection.classList.add("hidden");
            } else {
              alert("Erro ao criar postagem");
            }
          })
          .catch(err => {
            console.error("Erro ao enviar postagem:", err);
          });
      });

      newPostBtn.addEventListener("click", () => {
        postSection.classList.toggle("hidden");
      });

      carregarPostagens();
    });

  </script>
</body>

</html>
