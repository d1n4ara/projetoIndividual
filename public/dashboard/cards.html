<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" href="./assets/image/logo.png" type="image/x-icon">
  <title>Dashboard Entre Linhas</title>
  <link rel="stylesheet" href="../css/dashboards.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <nav class="menu-lateral" id="menuLateral">
    <h2>Entre Linhas</h2>
    <div class="hello">
      <h3>Olá, <span id="idUsuario">usuário</span>!</h3>
    </div>
    <ul>
      <li><a href="./cards.html">Dashboard</a></li>
      <li><a href="./livros.html">Minha Estante</a></li>
      <li><a href="./quiz.html">Quiz</a></li>
      <li><a href="./desafio.html">Comunidade</a></li>
      <li><a href="./perfil.html">Perfil</a></li>
      <li><a href="../index.html">Sair</a></li>
    </ul>
  </nav>


  <!-- Conteúdo principal -->
  <main class="content" id="mainContent">
    <h1>Dashboard Entre Linhas</h1>

    <div class="kpis">
      <div class="kpi">
        <h2 id="favoritosCount">0</h2>
        <p>Livros Favoritados</p>
      </div>
      <div class="kpi">
        <h2 id="maiorPontuacao">0</h2>
        <p>Maior Pontuação no Quiz</p>
      </div>
      <div class="kpi">
        <h2 id="generoFavorito">--</h2>
        <p>Gênero Favorito</p>
      </div>
      <div class="kpi">
        <h2 id="quantidadeQuizzes">0</h2>
        <p>Quizzes Realizados</p>
      </div>
    </div>

    <div class="charts">
      <div style="max-width: 100%; height: 300px; overflow: hidden;">
        <canvas id="linhaPontuacoes"></canvas>
      </div>
      <div>
        <canvas id="barraFavoritosGenero"></canvas>
      </div>
    </div>
  </main>
  </div>

  <script>
    const idUsuario = sessionStorage.ID_USUARIO;

    window.onload = function () {
      if (!idUsuario) {
        alert("Usuário não identificado. Faça login novamente.");
        return;
      }

      carregarKPIs();
      carregarGraficos();
    };

    function fetchJson(url) {
      return fetch(url).then(res => {
        if (!res.ok) throw new Error("Erro na requisição");
        return res.json();
      });
    }

    function carregarKPIs() {
      fetchJson(`/dashboard/maior-pontuacao/${idUsuario}`)
        .then(maiorPontuacao => {
          document.getElementById("maiorPontuacao").innerText = maiorPontuacao.maiorPontuacao || 0;
        })
        .catch(e => console.error("Erro ao carregar maior pontuação:", e));

      fetchJson(`/dashboard/genero-favorito/${idUsuario}`)
        .then(generoFavorito => {
          document.getElementById("generoFavorito").innerText = generoFavorito.generoFavorito || "--";
        })
        .catch(e => console.error("Erro ao carregar gênero favorito:", e));

      fetchJson(`/dashboard/quantidade-quizzes/${idUsuario}`)
        .then(quantidadeQuizzes => {
          document.getElementById("quantidadeQuizzes").innerText = quantidadeQuizzes.totalQuizzes || 0;
        })
        .catch(e => console.error("Erro ao carregar quantidade de quizzes:", e));
    }

    function carregarGraficos() {
      // Gráfico de linha: pontuações
      fetchJson(`/dashboard/pontuacoes-quiz/${idUsuario}`)
        .then(pontuacoes => {
          const labelsLinha = pontuacoes.map(r => r.dataQuiz);
          const dataLinha = pontuacoes.map(r => r.pontuacao);

          new Chart(document.getElementById("linhaPontuacoes"), {
            type: 'line',
            data: {
              labels: labelsLinha,
              datasets: [{
                label: 'Pontuação no Quiz',
                data: dataLinha,
                borderColor: 'rgb(54, 162, 235)',
                tension: 0.5,
                pointRadius: 8,
                pointHoverRadius: 8,
              }]
            }, options: {
              responsive: true,
              maintainAspectRatio: false
            }

          });
        })
        .catch(e => console.error("Erro ao carregar gráfico de linha:", e));

      // Gráfico de barras: livros favoritados por gênero
      fetchJson(`/dashboard/favoritos-por-genero/${idUsuario}`)
        .then(favoritosGenero => {
          const labelsBarra = favoritosGenero.map(r => r.genero);
          const dataBarra = favoritosGenero.map(r => r.total);

          new Chart(document.getElementById("barraFavoritosGenero"), {
            type: 'bar',
            data: {
              labels: labelsBarra,
              datasets: [{
                label: 'Livros Favoritados por Gênero',
                data: dataBarra,
                backgroundColor: 'rgba(255, 99, 132, 0.7)',
                borderColor: 'rgb(255, 99, 132)',
                borderWidth: 1
              }]
            }
          });
        })
        .catch(e => console.error("Erro ao carregar gráfico de barras:", e));
    }
  </script>


</body>

</html>
