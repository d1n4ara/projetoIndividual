<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/image/logo.png" type="image/x-icon">
    <title>Quiz Literário</title>
    <link rel="stylesheet" href="../css/dashboards.css">
</head>
<body>
    <div class="container">
        <nav class="menu-lateral" id="menuLateral">
            <h2>Entre Linhas</h2>
            <ul>
              <li><a href="./cards.html">Dashboard</a></li>
              <li><a href="./livros.html">Minha Estante</a></li>
              <li><a href="./quiz.html">Quiz</a></li>
              <li><a href="./desafio.html">Missões e Desafios</a></li>
              <li><a href="./perfil.html">Perfil</a></li>
              <li><a href="../index.html">Sair</a></li>
            </ul>
        </nav>

        <main class="quiz-area">
            <h1>Quiz Literário</h1>
            <form id="quiz-form">
                <div id="perguntas-container"></div>
                <button type="button" id="botao-proximo" style="display: none;">Próxima</button>
                <button type="submit" id="botao-enviar" style="display: none;">Enviar Respostas</button>
            </form>
            <div id="resultado" class="hidden"></div>
        </main>
    </div>

    <script>
        let perguntas = [];
        let alternativas = [];
        let fkUsuario = 1; // Substituir com ID real se necessário
        let indiceAtual = 0;
        let respostasSelecionadas = {};

        async function carregarQuiz() {
            const respPerguntas = await fetch("/quiz/perguntas");
            perguntas = await respPerguntas.json();

            const respAlternativas = await fetch("/quiz/alternativas");
            alternativas = await respAlternativas.json();

            mostrarPergunta();
        }

        function mostrarPergunta() {
            const container = document.getElementById("perguntas-container");
            container.innerHTML = "";

            const pergunta = perguntas[indiceAtual];
            const alternativasPergunta = alternativas.filter(a => a.fkQuestao === pergunta.idQuestao);

            const bloco = document.createElement("div");
            bloco.className = "pergunta";
            bloco.innerHTML = `
                <h3>${pergunta.pergunta}</h3>
                ${alternativasPergunta.map(alt => `
                    <label>
                        <input type="radio" name="questao_${pergunta.idQuestao}" value="${alt.idAlternativa}" ${respostasSelecionadas[pergunta.idQuestao] == alt.idAlternativa ? "checked" : ""} required>
                        ${alt.texto}
                    </label><br>
                `).join("")}
            `;
            container.appendChild(bloco);

            const btnProximo = document.getElementById("botao-proximo");
            const btnEnviar = document.getElementById("botao-enviar");

            if (indiceAtual < perguntas.length - 1) {
                btnProximo.style.display = "inline-block";
                btnEnviar.style.display = "none";
            } else {
                btnProximo.style.display = "none";
                btnEnviar.style.display = "inline-block";
            }
        }

        document.getElementById("botao-proximo").addEventListener("click", () => {
            const pergunta = perguntas[indiceAtual];
            const selecionado = document.querySelector(`input[name='questao_${pergunta.idQuestao}']:checked`);

            if (!selecionado) {
                alert("Por favor, selecione uma alternativa.");
                return;
            }

            respostasSelecionadas[pergunta.idQuestao] = selecionado.value;
            indiceAtual++;
            mostrarPergunta();
        });

        document.getElementById("quiz-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            let acertos = 0;

            for (let pergunta of perguntas) {
                const idAlternativa = respostasSelecionadas[pergunta.idQuestao];
                const alternativa = alternativas.find(a => a.idAlternativa == idAlternativa);

                if (alternativa?.isCorreta) acertos++;

                await fetch("/quiz/respostas", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        fkUsuario,
                        fkQuestao: pergunta.idQuestao,
                        fkAlternativa: idAlternativa
                    })
                });
            }

            const porcentagem = ((acertos / perguntas.length) * 100).toFixed(2);

            await fetch("/quiz/resultados", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fkUsuario, pontuacao: acertos, porcentagem })
            });

            document.getElementById("quiz-form").style.display = "none";
            const resultado = document.getElementById("resultado");
            resultado.classList.remove("hidden");
            resultado.innerText = `Você acertou ${acertos} de ${perguntas.length} (${porcentagem}%)`;
        });

        carregarQuiz();
    </script>
</body>
</html>
